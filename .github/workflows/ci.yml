# AI Daily News - Continuous Integration
#
# Pipeline stages:
#   1. lint-and-type  — ruff + mypy (fast, fail-early)
#   2. test           — pytest with coverage gate (≥80%), excluding e2e
#   3. e2e            — Playwright browser suite (separate job, optional gate)
#   4. perf           — performance budgets (Constitution IV)
#
# Coverage artifact retained for 7 days for offline inspection.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger for debugging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint-and-type:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dev deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check backend/

      - name: Mypy
        run: mypy backend/app

  test:
    name: Unit + Integration (coverage ≥ 80%)
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations against temp SQLite
        # Verifies the migration chain is consistent (catches drift between
        # ORM models and migration files).
        working-directory: backend
        env:
          AIDAILY_DB_PATH: /tmp/aidaily-ci.db
          AIDAILY_LLM_API_KEY: dummy-key
          AIDAILY_BEARER_TOKEN: dummy-token
        run: alembic upgrade head

      - name: Pytest with coverage
        working-directory: backend
        env:
          AIDAILY_LLM_API_KEY: dummy-key
          AIDAILY_BEARER_TOKEN: dummy-token
        run: |
          pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --ignore=tests/e2e \
            --ignore=tests/performance \
            -v

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: backend/coverage.xml
          retention-days: 7

  perf:
    name: Performance Budgets (Constitution IV)
    runs-on: ubuntu-latest
    needs: test
    # Run on every PR + on main; perf regressions block merge per Constitution IV.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run perf budgets
        working-directory: backend
        env:
          AIDAILY_LLM_API_KEY: dummy-key
          AIDAILY_BEARER_TOKEN: dummy-token
        run: pytest tests/performance/ -v -m perf

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    # Optional: not a hard gate for non-frontend changes. Mark as continue-on-error
    # if flakiness blocks PRs. Remove the flag once stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install deps
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pip install pytest-playwright
          python -m playwright install --with-deps chromium

      - name: Run E2E
        working-directory: backend
        env:
          AIDAILY_LLM_API_KEY: dummy-key
          AIDAILY_BEARER_TOKEN: dummy-token
        run: pytest tests/e2e/ -v

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: backend/playwright-report/
          retention-days: 7
