<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 日报</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main id="app" x-data="dailyApp()" x-init="init()">
    <!-- Left index panel -->
    <aside class="panel panel-index">
      <header class="report-header">
        <div class="header-row">
          <h1 class="title">AI 日报</h1>
          <span class="edition" x-show="issue" x-text="issue?.date"></span>
          <span class="status-badge" :class="statusBadgeClass()" x-text="statusBadgeText()"></span>
          <button class="icon-btn" @click="openSettings()" aria-label="偏好设置">⚙</button>
        </div>
        <div class="badges" x-show="summary">
          <div class="badge-group">
            <template x-for="t in types" :key="t.key">
              <span class="badge"
                :class="isActiveType(t.key) ? 'badge-active' : ''"
                @click="toggleType(t.key)"
                x-text="`${t.shortName} ${summary?.byType?.[t.key] ?? 0}`"></span>
            </template>
          </div>
          <div class="badge-group">
            <template x-for="s in sources" :key="s.key">
              <span class="badge"
                :class="isActiveSource(s.key) ? 'badge-active' : ''"
                @click="toggleSource(s.key)"
                x-text="`${s.short} ${summary?.bySource?.[s.key] ?? 0}`"></span>
            </template>
          </div>
        </div>
      </header>

      <!-- Skeleton state -->
      <div class="skeleton-list" x-show="state === 'loading'">
        <template x-for="i in 5" :key="i">
          <div class="skeleton-item">
            <div class="skeleton-line skeleton-w-70"></div>
            <div class="skeleton-line skeleton-w-50"></div>
            <div class="skeleton-line skeleton-w-30"></div>
          </div>
        </template>
      </div>

      <!-- Empty state: not generated -->
      <div class="empty-state" x-show="state === 'not_generated'">
        <p>正在翻今天的墙头…</p>
        <p class="muted">首装后 5-10 分钟内会自动生成。</p>
      </div>

      <!-- Generating state: keep skeleton + poll -->
      <div class="empty-state" x-show="state === 'generating'">
        <p>今日刊正在生成中…</p>
        <p class="muted">已开始 LLM 摘要，请稍候。</p>
      </div>

      <!-- Empty filter result -->
      <div class="empty-state" x-show="state === 'empty_filter'">
        <p>今天的货架是空的</p>
        <p class="muted">换个筛选条件试试。</p>
      </div>

      <!-- Error state -->
      <div class="empty-state error" x-show="state === 'error'">
        <p x-text="errorMessage || '出错了，请稍后再试'"></p>
        <button class="btn" @click="retryLast()">重试</button>
      </div>

      <!-- Ready: article list -->
      <ul class="article-list" x-show="state === 'ready'">
        <template x-for="(a, idx) in articles" :key="a.id">
          <li class="article-item"
              :class="selectedArticle?.id === a.id ? 'selected' : ''"
              @click="selectArticle(a)">
            <div class="article-head">
              <span class="article-type" x-text="typeLabel(a.type)"></span>
              <span class="article-src" x-text="srcLabel(a.src)"></span>
              <span class="article-time" x-text="a.time"></span>
              <span class="article-min" x-text="`${a.readingMinutes} 分钟`"></span>
            </div>
            <h3 class="article-title" x-text="a.title"></h3>
            <p class="article-excerpt" x-text="a.excerpt"></p>
          </li>
        </template>
      </ul>
    </aside>

    <!-- Right reader panel -->
    <section class="panel panel-reader">
      <div class="reader-placeholder" x-show="!selectedArticle">
        <p>← 从左侧选一条资讯</p>
      </div>
      <article class="reader-detail" x-show="selectedArticle && detail">
        <template x-if="detail">
          <div>
            <header class="detail-head">
              <span class="article-type" x-text="typeLabel(detail.type)"></span>
              <span class="article-src" x-text="srcLabel(detail.src)"></span>
              <h2 class="detail-title" x-text="detail.title"></h2>
              <p class="detail-meta">
                <span x-text="detail.sourceName"></span>
                · <span x-text="`${detail.readingMinutes} 分钟阅读`"></span>
                · <span x-text="detail.publishedAt"></span>
              </p>
            </header>
            <p class="detail-lede" x-text="detail.lede"></p>
            <p class="detail-summary" x-text="detail.summary"></p>
            <template x-for="(p, i) in detail.body" :key="i">
              <p class="detail-body" x-text="p"></p>
            </template>
            <blockquote class="detail-quote" x-show="detail.quote" x-text="detail.quote"></blockquote>
            <h4>要点</h4>
            <ul class="detail-points">
              <template x-for="(pt, i) in detail.points" :key="i">
                <li x-text="pt"></li>
              </template>
            </ul>
            <a class="btn btn-primary" :href="detail.sourceUrl" target="_blank" rel="noopener">阅读原文</a>
            <button class="btn btn-share" @click="shareCurrentArticle()" :disabled="shareBusy" style="margin-left:.5rem">
              <span x-show="!shareBusy">分享这条</span>
              <span x-show="shareBusy">生成中…</span>
            </button>
          </div>
        </template>
      </article>
    </section>
  </main>

  <!-- Share modal (T080) -->
  <div class="share-overlay" x-show="shareModalOpen" x-cloak @click.self="closeShareModal()" role="dialog" aria-label="分享卡片">
    <div class="share-modal">
      <header class="share-head">
        <h2>分享这条</h2>
        <button class="icon-btn" @click="closeShareModal()" aria-label="关闭">×</button>
      </header>
      <section class="share-body" x-show="shareCard">
        <p class="share-title" x-text="shareCard?.articleTitle"></p>
        <p class="share-url" x-text="shareCard?.cardUrl"></p>
        <div class="share-actions">
          <button class="btn" @click="copyShareUrl()">
            <span x-show="!shareCopyState">复制链接</span>
            <span x-show="shareCopyState" x-text="shareCopyState"></span>
          </button>
          <button class="btn btn-primary" @click="openShareInNewTab()">打开</button>
        </div>
      </section>
    </div>
  </div>

  <!-- Settings panel (T070) -->
  <div class="settings-overlay" x-show="settingsOpen" x-cloak @click.self="closeSettings()" role="dialog" aria-label="偏好设置">
    <div class="settings-modal">
      <header class="settings-head">
        <h2>我的偏好</h2>
        <button class="icon-btn" @click="closeSettings()" aria-label="关闭">×</button>
      </header>

      <section class="settings-section">
        <h3>信息来源</h3>
        <div class="switch-list">
          <template x-for="s in sources" :key="s.key">
            <label class="switch-row">
              <span class="switch-label" x-text="s.name"></span>
              <input type="checkbox"
                     :checked="settingsForm.sources[s.key]"
                     @change="settingsForm.sources[s.key] = $event.target.checked" />
              <span class="switch-knob"></span>
            </label>
          </template>
        </div>
      </section>

      <section class="settings-section">
        <h3>信息类型</h3>
        <div class="switch-list">
          <template x-for="t in types" :key="t.key">
            <label class="switch-row">
              <span class="switch-label" x-text="t.name"></span>
              <input type="checkbox"
                     :checked="settingsForm.types[t.key]"
                     @change="settingsForm.types[t.key] = $event.target.checked" />
              <span class="switch-knob"></span>
            </label>
          </template>
        </div>
      </section>

      <section class="settings-section">
        <h3>每日推送</h3>
        <label class="switch-row">
          <span class="switch-label">启用每日推送</span>
          <input type="checkbox"
                 :checked="settingsForm.dailyPush.enabled"
                 @change="settingsForm.dailyPush.enabled = $event.target.checked" />
          <span class="switch-knob"></span>
        </label>
        <label class="time-row" :class="settingsForm.dailyPush.enabled ? '' : 'time-disabled'">
          <span class="switch-label">推送时间</span>
          <input type="time"
                 pattern="([01]\d|2[0-3]):[0-5]\d"
                 x-model="settingsForm.dailyPush.time"
                 :disabled="!settingsForm.dailyPush.enabled" />
        </label>
        <p class="field-error" x-show="settingsFormError" x-text="settingsFormError"></p>
      </section>

      <footer class="settings-foot">
        <button class="btn" @click="resetSettings()" :disabled="settingsSaving">恢复默认</button>
        <button class="btn btn-primary" @click="saveSettings()" :disabled="settingsSaving">
          <span x-show="!settingsSaving">保存</span>
          <span x-show="settingsSaving">保存中…</span>
        </button>
      </footer>
    </div>
  </div>

  <!-- Global toast (T082) -->
  <div class="toast" x-data x-show="false" role="status" aria-live="polite"></div>

  <!-- Global error panel for 9001/9002 (T083/T084) -->
  <div class="error-panel" x-data x-show="false" x-cloak role="alert" aria-live="assertive">
    <div class="error-panel-body">
      <p class="error-panel-title" x-text="errorMessage || '服务开了小差'"></p>
      <p class="error-panel-hint muted" x-show="state === 'error'">可以重试一下，我们已经记下这次失败。</p>
      <button class="btn btn-primary" @click="retryLast()">重试</button>
    </div>
  </div>

  <!-- Login panel for 1003 (T085) -->
  <div class="login-overlay" x-show="loginOpen" x-cloak @click.self="closeLoginPanel()" role="dialog" aria-label="登录">
    <div class="login-modal">
      <header class="login-head">
        <h2>需要登录</h2>
        <button class="icon-btn" @click="closeLoginPanel()" aria-label="关闭">×</button>
      </header>
      <section class="login-body">
        <p class="muted">请输入访问令牌（Bearer Token）以继续操作。</p>
        <label class="login-row">
          <span class="switch-label">Token</span>
          <input type="password" autocomplete="off" x-model="loginToken" placeholder="在 AIDAILY_BEARER_TOKEN 中配置的令牌" />
        </label>
        <p class="field-error" x-show="loginError" x-text="loginError"></p>
        <p class="muted" style="font-size: 0.85em; margin-top: 0.5rem;">
          将保存在 localStorage 的 <code>AIDAILY_TOKEN</code> 中。
        </p>
      </section>
      <footer class="login-foot">
        <button class="btn" @click="closeLoginPanel()">取消</button>
        <button class="btn btn-primary" @click="submitLogin()">登录并重试</button>
      </footer>
    </div>
  </div>

  <script src="/static/vendor/alpine.min.js" defer></script>
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
