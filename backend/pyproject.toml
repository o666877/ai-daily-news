[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidaily-backend"
version = "1.0.0"
description = "AI Daily News - PC local web app for AI news aggregation daily"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Daily" }]

dependencies = [
    "fastapi==0.110.3",
    "uvicorn[standard]==0.29.0",
    "slowapi==0.1.9",
    "anthropic==0.27.0",
    "tenacity==8.3.0",
    "aiosqlite==0.20.0",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "httpx==0.27.0",
    "feedparser==6.0.11",
    "trafilatura==1.10.0",
    "selectolax==0.3.21",
    "praw==7.7.1",
    "apscheduler==3.10.4",
    "tzdata==2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "respx==0.21.1",
    "ruff==0.4.7",
    "mypy==1.10.0",
    # pytest-playwright deferred to T053 (E2E phase); not needed for MVP US1
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80 -q"
